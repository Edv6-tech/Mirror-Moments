<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
    <title>Mirror Moment — Skin & Style Intelligence</title>
    <meta name="description" content="Know before you buy. Ingredient safety and color-matched apparel virtual try-on powered by YouCam Skin AI." />
    <!-- Modern clean styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --bg-main: #0B0F19;
        --bg-card: #161F30;
        --bg-card-subtle: #1F2B42;
        --border-color: #2D3A54;
        --primary: #4F46E5;
        --primary-hover: #4338CA;
        --accent-emerald: #10B981;
        --accent-amber: #F59E0B;
        --accent-rose: #F43F5E;
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-sans);
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea {
        font-family: inherit;
        font-size: 100%;
      }
      /* Tap target accessibility */
      button, a, input[type="button"], input[type="submit"] {
        min-height: 44px;
        min-width: 44px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
